<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-labelledby="t">
  <title id="t">The deep sea: an anglerfish, jellyfish and glowing lanternfish</title>
  <style>
    .swim-r { animation: swim-r linear infinite; }
    .swim-l { animation: swim-l linear infinite; }
    @keyframes swim-r { from { transform: translateX(-140px); } to { transform: translateX(980px); } }
    @keyframes swim-l { from { transform: translateX(980px); } to { transform: translateX(-140px); } }

    .bob { animation: bob 4s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(-5px); } to { transform: translateY(5px); } }

    .tail { transform-box: fill-box; transform-origin: right center; animation: wag .6s ease-in-out infinite alternate; }
    @keyframes wag { from { transform: scaleY(.7); } to { transform: scaleY(1.1); } }

    .lure { animation: lure 2.4s ease-in-out infinite alternate; }
    @keyframes lure { from { opacity: .35; } to { opacity: 1; } }

    .drift { animation: drift ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateY(18px); } to { transform: translateY(-18px); } }

    .pulse { transform-box: fill-box; transform-origin: center top; animation: pulse 1.6s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: scale(1, 1); } to { transform: scale(1.08, .86); } }

    .snow { animation: snow linear infinite; }
    @keyframes snow {
      0%   { transform: translate(0, -10px); opacity: 0; }
      15%  { opacity: .8; }
      100% { transform: translate(-12px, 210px); opacity: 0; }
    }

    .twinkle { animation: twinkle 3s ease-in-out infinite alternate; }
    @keyframes twinkle { from { opacity: .15; } to { opacity: .9; } }

    .sway { transform-box: fill-box; transform-origin: bottom center; animation: sway 6s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

    @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
  </style>

  <defs>
    <linearGradient id="abyss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2142"/>
      <stop offset=".5" stop-color="#06122a"/>
      <stop offset="1" stop-color="#020611"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffe98a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="840" height="200" rx="14"/></clipPath>

    <!-- anglerfish, faces right -->
    <symbol id="angler" viewBox="0 -16 112 86" overflow="visible">
      <path class="tail" d="M24 38 L4 20 Q11 38 4 58 Z" fill="#1a2538" stroke="#34507a" stroke-width="1.5"/>
      <path d="M22 38 Q30 10 70 14 Q100 18 106 38 Q100 60 68 62 Q32 64 22 38 Z" fill="#1a2538" stroke="#34507a" stroke-width="1.5"/>
      <path d="M50 52 Q56 68 66 58 Z" fill="#22314a" stroke="#34507a" stroke-width="1.2"/>
      <path d="M80 44 Q93 52 106 41" stroke="#0a0f1a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M83 45 l2 5 l2 -4 l2 5 l2 -4 l2 5 l2 -4 l2 5 l2 -5 l2 4" stroke="#dfe8f5" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
      <circle cx="86" cy="28" r="5" fill="#dfe8f5"/>
      <circle cx="87" cy="28" r="2.4" fill="#020611"/>
      <path d="M74 15 Q84 -12 104 4" stroke="#34507a" stroke-width="2" fill="none"/>
      <circle cx="104" cy="6" r="22" fill="url(#halo)" class="lure"/>
      <circle cx="104" cy="6" r="4" fill="#ffe98a" filter="url(#glow)" class="lure"/>
    </symbol>

    <!-- lanternfish, faces right -->
    <symbol id="lantern" viewBox="0 0 60 30" overflow="visible">
      <path class="tail" d="M14 15 L1 5 Q5 15 1 25 Z" fill="#23395b"/>
      <ellipse cx="34" cy="15" rx="22" ry="9" fill="#23395b"/>
      <g fill="#6ff3ff" filter="url(#glow)">
        <circle cx="24" cy="19" r="1.6"/><circle cx="32" cy="20" r="1.6"/><circle cx="40" cy="20" r="1.6"/>
      </g>
      <circle cx="49" cy="13" r="3" fill="#6ff3ff" opacity=".85"/>
      <circle cx="49.6" cy="13" r="1.4" fill="#020611"/>
    </symbol>

    <!-- jellyfish -->
    <symbol id="jelly" viewBox="0 0 40 70" overflow="visible">
      <g filter="url(#glow)">
        <g class="pulse">
          <path d="M2 20 Q2 0 20 0 Q38 0 38 20 Q30 16 20 20 Q10 16 2 20 Z" fill="currentColor" fill-opacity=".55"/>
          <path d="M9 14 Q11 5 20 5 Q29 5 31 14" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.5" fill="none"/>
        </g>
        <g stroke="currentColor" stroke-opacity=".5" stroke-width="1.4" fill="none">
          <path d="M8 19 q-4 10 0 20 q4 10 0 20"/>
          <path d="M16 20 q4 12 0 24 q-4 12 0 22"/>
          <path d="M24 20 q-4 12 0 24 q4 12 0 18"/>
          <path d="M32 19 q4 10 0 20 q-4 10 0 22"/>
        </g>
      </g>
    </symbol>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="840" height="200" fill="url(#abyss)"/>

    <!-- distant twinkling plankton -->
    <g fill="#9fe7ff">
      <circle class="twinkle" cx="40" cy="30" r="1"/>
      <circle class="twinkle" cx="150" cy="70" r="1.2" style="animation-delay:-1s"/>
      <circle class="twinkle" cx="260" cy="24" r="1" style="animation-delay:-2s"/>
      <circle class="twinkle" cx="350" cy="110" r="1.3" style="animation-delay:-.5s"/>
      <circle class="twinkle" cx="470" cy="40" r="1" style="animation-delay:-1.7s"/>
      <circle class="twinkle" cx="560" cy="90" r="1.2" style="animation-delay:-2.4s"/>
      <circle class="twinkle" cx="650" cy="20" r="1" style="animation-delay:-.9s"/>
      <circle class="twinkle" cx="760" cy="60" r="1.3" style="animation-delay:-1.3s"/>
      <circle class="twinkle" cx="810" cy="130" r="1" style="animation-delay:-2.8s"/>
      <circle class="twinkle" cx="95" cy="140" r="1.1" style="animation-delay:-.3s"/>
    </g>

    <!-- marine snow -->
    <g fill="#c9d8ee">
      <circle class="snow" cx="80" cy="0" r="1.3" style="animation-duration:16s"/>
      <circle class="snow" cx="210" cy="0" r="1" style="animation-duration:20s;animation-delay:-7s"/>
      <circle class="snow" cx="330" cy="0" r="1.5" style="animation-duration:18s;animation-delay:-12s"/>
      <circle class="snow" cx="440" cy="0" r="1" style="animation-duration:22s;animation-delay:-3s"/>
      <circle class="snow" cx="590" cy="0" r="1.2" style="animation-duration:17s;animation-delay:-9s"/>
      <circle class="snow" cx="690" cy="0" r="1" style="animation-duration:21s;animation-delay:-15s"/>
      <circle class="snow" cx="790" cy="0" r="1.4" style="animation-duration:19s;animation-delay:-5s"/>
    </g>

    <!-- jellyfish -->
    <g transform="translate(170,40)"><g class="drift" style="animation-duration:7s"><use href="#jelly" width="40" height="70" style="color:#b48cff"/></g></g>
    <g transform="translate(610,62)"><g class="drift" style="animation-duration:9s;animation-delay:-4s"><use href="#jelly" width="30" height="52" style="color:#ff8fd8"/></g></g>

    <!-- lanternfish -->
    <g class="swim-r" style="animation-duration:20s;animation-delay:-8s"><g class="bob"><use href="#lantern" x="0" y="30" width="44" height="22"/></g></g>
    <g class="swim-r" style="animation-duration:20s;animation-delay:-9s"><g class="bob" style="animation-delay:-1s"><use href="#lantern" x="0" y="52" width="36" height="18"/></g></g>
    <g class="swim-l" style="animation-duration:26s;animation-delay:-3s"><g class="bob" style="animation-delay:-2s"><use href="#lantern" x="-40" y="138" width="40" height="20" transform="scale(-1 1)"/></g></g>

    <!-- anglerfish, slow and menacing -->
    <g class="swim-l" style="animation-duration:45s;animation-delay:-20s">
      <g class="bob" style="animation-duration:5s">
        <use href="#angler" x="-120" y="80" width="120" height="92" transform="scale(-1 1)"/>
      </g>
    </g>

    <!-- seabed -->
    <path d="M0 180 Q80 170 160 178 T320 176 T480 181 T640 175 T840 179 V200 H0 Z" fill="#0b1424"/>
    <g transform="translate(60,186)"><path class="sway" d="M0 0 q-7 -14 0 -28 q7 -14 0 -28" stroke="#123a3a" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(740,186)"><path class="sway" style="animation-delay:-3s" d="M0 0 q7 -14 0 -28 q-7 -14 0 -24" stroke="#123a3a" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    <g fill="#4dffc3" filter="url(#glow)">
      <circle class="twinkle" cx="58" cy="160" r="1.6"/>
      <circle class="twinkle" cx="742" cy="164" r="1.6" style="animation-delay:-1.5s"/>
      <circle class="twinkle" cx="420" cy="182" r="1.4" style="animation-delay:-.7s"/>
    </g>
  </g>
</svg>
